# CardanoInterface CI
# Stages: test (static analysis + compliance + tests + SAST) → secret-detection
# → dependency-scanning. This file is the reviewer-visible mirror of the
# operator's local commit gate (audit/ci/, untracked): same checks minus
# machine-local tooling. End-to-end behaviour is additionally validated on
# Preprod with the `live` marker (opt-in, never runs here).
stages:
- test
- secret-detection
- dependency-scanning

variables:
  SECRET_DETECTION_ENABLED: 'true'

include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
- template: Security/Jobs/Dependency-Scanning.gitlab-ci.yml

sast:
  stage: test

secret_detection:
  stage: secret-detection

default:
  image: ghcr.io/astral-sh/uv:0.9.9-python3.12-bookworm-slim
  cache:
    key:
      files:
      - uv.lock
    paths:
    - .venv

# Intersect OSC documentation must-haves + claim hygiene + lockfile/SBOM.
# Mirrors the local commit gate's compliance checks (minus local-only tooling).
compliance:
  stage: test
  script:
  - uv sync --locked
  - >-
    for req in README.md DESCRIPTION LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md
    CODEOWNERS CHANGELOG.md SECURITY.md MAINTAINERS.md ROADMAP.md .gitlab-ci.yml
    .gitlab/issue_templates/bug.md .gitlab/issue_templates/feature_request.md
    .gitlab/merge_request_templates/default.md; do
    test -f "$req" || { echo "OSC must-have missing: $req"; exit 1; }; done
  - >-
    if grep -rinE "critical infrastructure|actively used in the ecosystem|widely adopted"
    --include='*.md' . ; then
    echo "Overclaim terms in shipped docs are not permitted (usage is not claimable)";
    exit 1; fi
  - uv lock --check
  - uv export --format requirements-txt --output-file requirements.txt
  artifacts:
    paths:
    - requirements.txt
    expire_in: 30 days
  rules:
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Static analysis — the enforced gate (ultra-strict mypy, ruff; zero errors).
test:
  stage: test
  script:
  - uv sync --locked
  - uv run mypy CardanoInterface.py
  - uv run ruff check CardanoInterface.py
  rules:
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Hermetic test suite (golden-vector probes + recorded integrations).
# Activates automatically when tests/ lands; L3 live tests are marker-excluded.
tests:
  stage: test
  script:
  - uv sync --locked
  - uv run pytest -m "not live"
  rules:
  - exists:
    - tests/test_*.py
