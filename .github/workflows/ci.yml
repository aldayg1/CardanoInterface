# GitHub mirror CI — fast test gate for the mirror.
# Canonical CI is .gitlab-ci.yml (mypy strict + ruff + SAST + secrets).
# This workflow exists so the GitHub mirror (used for Intersect
# attestation review) shows its own green signal on every push/PR.
name: mirror-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -m "not live" -q
